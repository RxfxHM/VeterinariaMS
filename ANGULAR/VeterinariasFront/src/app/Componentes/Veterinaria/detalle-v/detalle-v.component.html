<div class="container mt-4">
    <h2>Lista de Responsables</h2>
  
    <!-- Estado de carga -->
    <div *ngIf="responsables === undefined" class="text-center my-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p>Cargando responsables...</p>
    </div>
  
    <!-- Lista cuando hay datos -->
    <div *ngIf="responsables && responsables.length > 0">
      <ul class="list-group">
        <li *ngFor="let item of responsables" class="list-group-item">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h5 class="mb-1">{{item.nombre}}</h5>
              <small class="text-muted">ID: {{item.idResponsable}}</small>
            </div>
            <span class="mb-4 badge bg-primary rounded-pill">
              {{item.contacto}}
            </span>
          </div>
        </li>
      </ul>
    </div>
