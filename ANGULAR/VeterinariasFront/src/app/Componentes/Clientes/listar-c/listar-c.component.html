<div class="content">
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div>
                    <h3>Listado de Clientes</h3>
                </div>
                <div id="buscars" class="input-group">
                    <input 
                        type="text"
                        class="form-control"
                        placeholder="Escribe el ID del Cliente a buscar..."
                        aria-label="Buscar"
                        aria-describedby="Buscar"
                        
                        
                    >
                </div>
            </div>
            <div class="card-body"></div>
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID CLIENTE</th>
                        <th>NOMBRE</th>
                        <th>DIRECCION</th>
                        <th>CONTACTO</th>
                        <th>EDITAR</th>
                        <th>ELIMINAR</th>
                        <th>MASCOTA</th>
                        
                    </tr>
                </thead>
                <tbody>
                    @for (cliente of clientes; track cliente.idCliente){
                        <tr>
                            <td>{{cliente.idCliente}}</td>
                            <td>{{cliente.nombre}}</td>
                            <td>{{cliente.direccion}}</td>
                            <td>{{cliente.contacto}}</td>
                            <td><button class="btn btn-warning" (click) = "editar(cliente)"> Editar</button></td>
                            <td><button class="btn btn-danger" (click) = "eliminar(cliente.idCliente)">Eliminar</button></td>
                            <td><button class="btn btn-azul" (click) = "detalle(cliente)">Ver Detalle</button></td>
                        </tr>
                    } @empty{
                        <tr>
                            <td colspan="4" style="text-align: center;"> NO EXISTEN REGISTROS PARA MOSTRAR</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
