<div class="content">
    <div class="container">
      <div class="card">
        <div class="card-header">
          <div>
            <h4>Eliminar Cliente</h4>
          </div>
        </div>
        <div class="card-body">
          <form>
  
            <div class="form-group">
              <label for="idCliente">ID</label>
              <input type="number" class="form-control" name="idCliente" [(ngModel)]="cliente.idCliente" readonly>
            </div>
  
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input type="text" class="form-control" name="nombre" [(ngModel)]="cliente.nombre" readonly>
            </div>
  
            <div class="form-group">
              <label for="direccion">Direccion</label>
              <input type="text" class="form-control" name="direccion" [(ngModel)]="cliente.direccion" readonly>
            </div>
  
            <div class="form-group">
              <label for="contacto">Contacto</label>
              <input type="number" class="form-control" name="contacto" [(ngModel)]="cliente.contacto" readonly>
            </div>

  
            <br><button class="btn btn-warning" (click) = "eliminar()">Eliminar</button>
  
          </form>
        </div>
      </div>
    </div>
  </div>
