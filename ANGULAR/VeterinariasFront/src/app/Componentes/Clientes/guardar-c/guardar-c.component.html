<div class="content">
    <div class="container">
      <div class="card">
        <div class="card-header">
          <div>
            <h4>Agregar Cliente</h4>
          </div>
        </div>
        <div class="card-body">
          <form>
  
           <!--  <div class="form-group">
              <label for="idCliente">ID</label>
              <input type="number" class="form-control" name="idCliente" [(ngModel)]="cliente.idCliente" min="1">
            </div>-->
  
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input type="text" class="form-control" name="nombre" [(ngModel)]="cliente.nombre">
            </div>
  
            <div class="form-group">
              <label for="direccion">Direccion</label>
              <input type="text" class="form-control" name="direccion" [(ngModel)]="cliente.direccion">
            </div>
  
            <div class="form-group">
              <label for="contacto">Telefono</label>
              <input type="number" class="form-control" name="contacto" [(ngModel)]="cliente.contacto">
            </div>

  
            <br><button class="btn btn-warning" (click) = "guardarCliente()">Guardar</button>
  
          </form>
        </div>
      </div>
    </div>
  </div>
